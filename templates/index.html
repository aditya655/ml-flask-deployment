<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> Email Spam Classifier</title>
  </head>
  <body>
  <h1> Email Spam Classifier</h1>
  
  <div>
    <form method="POST">
      <textarea
        rows="12"
        cols="60"
        name="content"
        placeholder="Type or paste your email here">{{text}}</textarea>
      <div>
        <button type="submit">
          Submit
        </button>
      </div>
    </form>
  </div>

  <div>
    <p> {{ text}} </p>
  </div>
</body>

</html>
