<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> Email Spam Classifier</title>
  </head>
  <body>
  <h1> Email Spam Classifier</h1>
  
  <div>
    <form method="POST" action="/predict">
      <textarea
        rows="12"
        cols="60"
        name="content"
        placeholder="Type or paste your email here">{{email}}</textarea>
      <div>
        <button type="submit">
          Submit
        </button>
      </div>
    </form>
  </div>

  <div>
    {% if prediction %}
       {% if prediction == 1 %}
         <h2> Spam</h2>
       {% else %}
         <h2> Not Spam</h2>
       {% endif %}
    {% endif %}
  </div>
</body>

</html>
